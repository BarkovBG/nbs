syntax = "proto3";
package snapshots;
option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/snapshots/protos";

message BackupFolderRequest {
    string FolderId = 1;
    string Generation = 2;
}
message BackupFolderState {
    string AfterId = 1;
    int64 CreatedBeforeMicros = 2;
    bool Prepared = 3;
    bool InitialPassComplete = 4;
    uint64 Round = 5;
}
message SnapshotBackupPlanState {
    string PrepareTaskId = 1;
    bool Prepared = 2;
    reserved 3;
    string CopyTaskId = 4;
    bool Excluded = 5;
    bool Complete = 6;
    bool CopyRequested = 7;
    bool PrepareRequested = 8;
}
