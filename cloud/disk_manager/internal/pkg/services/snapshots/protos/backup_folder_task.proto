syntax = "proto3";
package snapshots;
option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/snapshots/protos";

message BackupFolderRequest {
    string FolderId = 1;
    string Generation = 2;
}
message BackupFolderState {
    string AfterId = 1;
    reserved 2, 3, 4;
    uint64 Round = 5;
    string SnapshotId = 6;
    string OwnerId = 7;
    string BackupTaskId = 8;
}
