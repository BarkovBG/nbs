syntax = "proto3";

package snapshots;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/snapshots/protos";

import "cloud/disk_manager/internal/pkg/dataplane/protos/backup_snapshot_data_task.proto";

////////////////////////////////////////////////////////////////////////////////

message BackupSnapshotRequest {
    string SnapshotId = 1;
    string BackupId = 2;
    bytes EncryptedDek = 3;
    string CoordinatorId = 4;
    repeated string AncestorIds = 5;
}

message BackupSnapshotTaskState {
    string DataplaneTaskID = 1;
    bytes EncryptedDek = 2;
    dataplane.BackupSnapshotDataRequest DataplaneRequest = 3;
    bool Finished = 4;
    string DependencyReaderTaskId = 5;
    bool DependenciesRead = 6;
    repeated string DependencyIds = 7;
    uint32 DependencyIndex = 8;
    string DependencyTaskId = 9;
    repeated string CompletedSnapshotIds = 10;
    bool AlreadyBackedUp = 11;
}

message BackupSnapshotResponse {
    bool Completed = 1;
    repeated string CompletedSnapshotIds = 2;
}
