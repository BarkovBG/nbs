syntax = "proto3";

package snapshots;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/snapshots/protos";

import "cloud/disk_manager/internal/pkg/dataplane/protos/backup_snapshot_data_task.proto";

////////////////////////////////////////////////////////////////////////////////

message BackupSnapshotRequest {
    string SnapshotId = 1;
    string BackupId = 2;
}

message BackupSnapshotTaskState {
    // The copy in progress: the saved request accepts it, the child ID
    // survives an interrupted ScheduleTask.
    string DataplaneTaskID = 1;
    dataplane.BackupSnapshotDataRequest DataplaneRequest = 2;

    // Copy order: creators of chunks first, the requested snapshot last.
    repeated SnapshotBackupNode Nodes = 3;
}

message BackupSnapshotResponse {
    bool Completed = 1;
    repeated string CompletedSnapshotIds = 2;
}

message SnapshotBackupNode {
    string SnapshotId = 1;
    bool Completed = 2;
    // Missing or deleted before its copy was accepted.
    bool Skipped = 3;
}
