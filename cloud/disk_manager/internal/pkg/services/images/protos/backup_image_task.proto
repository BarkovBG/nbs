syntax = "proto3";

package images;

import "cloud/disk_manager/internal/pkg/dataplane/protos/backup_snapshot_data_task.proto";

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/services/images/protos";

////////////////////////////////////////////////////////////////////////////////

message BackupImageRequest {
    string ImageId = 1;
    string BackupId = 2;
}

message BackupImageTaskState {
    string DataplaneTaskID = 1;
    dataplane.BackupSnapshotDataRequest DataplaneRequest = 2;
}
