syntax = "proto3";

package dataplane;

option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/protos";

////////////////////////////////////////////////////////////////////////////////

message ListSnapshotChunkCreatorsRequest {
    string SnapshotId = 1;
}

message ListSnapshotChunkCreatorsTaskState {
    repeated string SnapshotIds = 1;
}

// Snapshots that created chunks of the requested one, without the snapshot
// itself. Empty if the snapshot is missing or not ready.
message ListSnapshotChunkCreatorsResponse {
    repeated string SnapshotIds = 1;
}
