syntax = "proto3";
package dataplane;
option go_package = "github.com/ydb-platform/nbs/cloud/disk_manager/internal/pkg/dataplane/protos";

message LockSnapshotForBackupRequest {
    string SnapshotId = 1;
}

// CP reads metadata while the task is waiting for RELEASE. Ready without Locked
// means the source was missing or deletion won admission; no copy may start.
message LockSnapshotForBackupState {
    repeated string SnapshotIds = 1;
    bool Ready = 2;
    bool Locked = 3;
}

enum SnapshotBackupLockEvent {
    RELEASE = 0;
}
